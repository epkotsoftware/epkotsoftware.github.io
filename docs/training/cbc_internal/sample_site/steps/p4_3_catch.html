<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAMPLE SITE - 拡張ステップ3 キャッチコピー追加</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif; color: #333; background: #fff; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    .header, .contents { width: 980px; margin: 0 auto; }

    /* ヘッダー：ロゴ ＋ ナビ */
    .header { height: 90px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; }
    .logo .mark { width: 40px; height: 40px; border-radius: 8px; margin-right: 10px;
                  background: linear-gradient(135deg, #2b6cb0, #30a46c); }
    .logo .name { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
    .nav ul { display: flex; }
    .nav li { margin-left: 24px; font-size: 14px; }
    .nav li:hover { color: #2b6cb0; }

    /* ビジュアル（ヒーロー） */
    .visual { height: 360px; margin-bottom: 56px;
      background: linear-gradient(120deg, #1a3a5c 0%, #2b6cb0 55%, #30a46c 100%);
      display: flex; align-items: center; }
    .visual .copy { color: #fff; padding-left: 60px; }
    .visual .copy h1 { font-size: 40px; line-height: 1.3; }
    .visual .copy p { font-size: 16px; margin-top: 12px; opacity: .9; }

    /* レッスンカード×3（flex） */
    .lessons { display: flex; justify-content: space-between; margin-bottom: 64px; }
    .card { width: 300px; border: 1px solid #eee; border-radius: 10px; overflow: hidden;
            box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .card .thumb { height: 160px; display: flex; align-items: center; justify-content: center;
                   color: #fff; font-size: 20px; font-weight: bold; letter-spacing: 1px; }
    .card:nth-child(1) .thumb { background: linear-gradient(135deg, #e5484d, #f76808); }
    .card:nth-child(2) .thumb { background: linear-gradient(135deg, #f5a623, #f7ce00); }
    .card:nth-child(3) .thumb { background: linear-gradient(135deg, #2b6cb0, #8e4ec6); }
    .card .body { padding: 18px; }
    .card .body h3 { font-size: 18px; margin-bottom: 8px; }
    .card .body p { font-size: 13px; color: #666; line-height: 1.8; }

    /* catchcopy */
    .catchcopy { text-align: center; margin-bottom: 64px; }
    .catchcopy h2 { font-size: 44px; letter-spacing: 4px; color: #222; }
    .catchcopy p { margin-top: 12px; color: #666; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <img class="mark" src="../logo_mark.svg" alt="" width="40" height="40">
      <div class="name">SAMPLE SITE</div>
    </div>
    <nav class="nav">
      <ul>
        <li>ホーム</li><li>レッスン</li><li>入門</li><li>基礎</li><li>応用</li><li>実践</li>
      </ul>
    </nav>
  </div>

  <div class="contents">
    <div class="visual">
      <div class="copy">
        <h1>Webの基礎を、<br>手を動かして学ぶ。</h1>
        <p>HTML / CSS からはじめる制作入門</p>
      </div>
    </div>

    <div class="lessons">
      <div class="card">
        <div class="thumb">HTML &amp; CSS</div>
        <div class="body"><h3>HTML &amp; CSS</h3>
          <p>Webページの構造と装飾。枠組みからレイアウトまでの基礎を学びます。</p></div>
      </div>
      <div class="card">
        <div class="thumb">JavaScript</div>
        <div class="body"><h3>JavaScript</h3>
          <p>動きのあるページ作り。DOM操作やイベントの基本を身につけます。</p></div>
      </div>
      <div class="card">
        <div class="thumb">PHP</div>
        <div class="body"><h3>PHP</h3>
          <p>サーバーサイドの入門。フォーム処理やDB連携の第一歩を学びます。</p></div>
      </div>
    </div>

    <div class="catchcopy">
      <h2>Work</h2>
      <p>手を動かして作る、から身につく。</p>
    </div>
  </div>

</body>
</html>
