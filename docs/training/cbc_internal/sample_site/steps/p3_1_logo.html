<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>step p3_1 logo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif; color: #333; background: #fff; }

    /* ヘッダー：全幅の帯＋中央寄せの header_contents（前ページの構造を引き継ぐ） */
    .header { border-bottom: 1px solid #e5e7eb; }
    .header_contents { width: 980px; margin: 0 auto; height: 84px; display: flex; align-items: center; }
    .logo { display: flex; align-items: center; }
    .logo .mark { width: 40px; height: 40px; border-radius: 8px; margin-right: 12px; }
    .logo .name { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header_contents">
      <div class="logo">
        <img class="mark" src="../images/logo_mark.svg" alt="" width="40" height="40">
        <div class="name">SAMPLE SITE</div>
      </div>
    </div>
  </div>

</body>
</html>
