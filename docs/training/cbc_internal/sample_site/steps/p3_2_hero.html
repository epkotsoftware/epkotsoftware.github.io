<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>step p3_2 hero</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif; color: #333; background: #fff; }
    ul { list-style: none; }

    .contents { width: 980px; margin: 0 auto; }

    /* ヘッダー：全幅の帯＋中央寄せの header_contents */
    .header { border-bottom: 1px solid #e5e7eb; }
    .header_contents { width: 980px; margin: 0 auto; height: 84px; display: flex; align-items: center; }
    .logo { display: flex; align-items: center; }
    .logo .mark { width: 40px; height: 40px; border-radius: 8px; margin-right: 12px; }
    .logo .name { font-size: 20px; font-weight: bold; letter-spacing: 1px; }

    /* ビジュアル：背景(プレースホルダ=グラデ)＋見出しオーバーレイ */
    .visual {
      height: 400px; margin-top: 32px; margin-bottom: 40px;
      background: linear-gradient(120deg, #1a3a5c 0%, #2b6cb0 55%, #30a46c 100%);
      display: flex; align-items: center;
    }
    .visual .copy { color: #fff; padding-left: 60px; }
    .visual .copy h1 { font-size: 40px; line-height: 1.3; }
    .visual .copy p { font-size: 16px; margin-top: 12px; opacity: .9; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header_contents">
      <div class="logo">
        <img class="mark" src="../images/logo_mark.svg" alt="" width="40" height="40">
        <div class="name">SAMPLE SITE</div>
      </div>
    </div>
  </div>

  <div class="contents">
    <div class="visual">
      <div class="copy">
        <h1>Webの基礎を、<br>手を動かして学ぶ。</h1>
        <p>HTML / CSS からはじめる制作入門</p>
      </div>
    </div>
  </div>

</body>
</html>
