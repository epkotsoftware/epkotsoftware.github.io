<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>p2_3 .text と .menu を横並び（flex）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif; background: #f4f4f4; color: #333; padding: 12px; }

    .lbl { position: absolute; top: 4px; left: 8px; font-size: 11px; color: #666; background: #f4f4f4; padding: 0 3px; z-index: 3; white-space: nowrap; }
    .lbl.r { left: auto; right: 8px; }

    /* header：全幅の箱（帯）＋中央寄せの header_contents */
    .header { position: relative; border: 2px solid #e5484d; padding: 16px 0; }
    .header_contents { position: relative; width: 980px; margin: 0 auto; height: 120px; border: 2px solid #e5484d; }
    .logo { position: relative; width: 220px; height: 56px; border: 2px solid #e5484d; margin: 20px; }

    /* contents：980px 中央寄せ */
    .contents { width: 980px; margin: 0 auto; }
    .visual { position: relative; height: 320px; border: 2px solid #2b6cb0; margin-top: 16px; }
    .copy { position: relative; width: 400px; height: 110px; border: 2px solid #2b6cb0; margin: 20px; }

    /* text_wrapper：flex で text と menu を横並び（中央寄せ） */
    .text_wrapper { position: relative; margin-top: 16px; padding-top: 24px; border: 1px dashed #94a3b8; display: flex; justify-content: center; align-items: flex-start; }
    .text_wrapper > .lbl { top: 5px; }
    .text { position: relative; width: 600px; height: 140px; border: 2px solid #30a46c; }
    .menu { position: relative; width: 344px; height: 140px; border: 2px solid #30a46c; margin-left: 16px; }

    /* footer：全幅の箱（帯）＋中央寄せの footer_contents */
    .footer { position: relative; border: 2px solid #8e4ec6; padding: 16px 0; margin-top: 16px; }
    .footer_contents { position: relative; width: 980px; margin: 0 auto; height: 100px; border: 2px solid #8e4ec6; }
  </style>
</head>
<body>
  <div class="header"><span class="lbl">.header（全幅の帯）</span>
    <div class="header_contents"><span class="lbl r">.header_contents（980px 中央）</span>
      <div class="logo"><span class="lbl r">.logo</span></div>
    </div>
  </div>

  <div class="contents">
    <div class="visual"><span class="lbl">.visual</span>
      <div class="copy"><span class="lbl r">.copy</span></div>
    </div>

    <div class="text_wrapper"><span class="lbl">.text_wrapper（flex）</span>
      <div class="text"><span class="lbl">.text</span></div>
      <div class="menu"><span class="lbl">.menu</span></div>
    </div>
  </div>

  <div class="footer"><span class="lbl">.footer（全幅の帯）</span>
    <div class="footer_contents"><span class="lbl r">.footer_contents（980px 中央）</span></div>
  </div>
</body>
</html>
