<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAMPLE SITE - 段階2 シンプル完成</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif; color: #333; background: #fff; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* 内側の中身を 980px で中央寄せ（全幅の受け皿の中に置く） */
    .header_contents, .contents, .footer_contents { width: 980px; margin: 0 auto; }

    /* ヘッダー：全幅（下線が画面端まで伸びる）／中身は header_contents で中央寄せ */
    .header { border-bottom: 1px solid #e5e7eb; }
    .header_contents { height: 84px; display: flex; align-items: center; }
    .logo { display: flex; align-items: center; }
    .logo .mark {
      width: 40px; height: 40px; border-radius: 8px; margin-right: 12px;
    }
    .logo .name { font-size: 20px; font-weight: bold; letter-spacing: 1px; }

    /* ビジュアル（980px内）：背景画像の代わりにグラデをプレースホルダ表示 */
    .visual {
      height: 360px; margin-top: 32px; margin-bottom: 40px;
      background: linear-gradient(120deg, #1a3a5c 0%, #2b6cb0 55%, #30a46c 100%);
      display: flex; align-items: center;
    }
    .visual .copy { color: #fff; padding-left: 56px; }
    .visual .copy h1 { font-size: 38px; line-height: 1.3; }
    .visual .copy p { font-size: 16px; margin-top: 12px; opacity: .9; }

    /* テキスト＋メニュー：flexで横並び */
    .text_wrapper { display: flex; justify-content: center; margin-bottom: 44px; }
    .text { width: 560px; padding-right: 40px; border-right: 1px solid #ddd; }
    .text h2 { font-size: 20px; margin-bottom: 12px; }
    .text p { line-height: 1.9; color: #555; }
    .menu { width: 240px; padding-left: 40px; }
    .menu li { padding: 10px 0; border-bottom: 1px solid #eee; }
    .menu li::before { content: "▸ "; color: #2b6cb0; }

    /* フッター：全幅（暗色帯が画面端まで）／中身は footer_contents で中央寄せ */
    .footer { background: #222; color: #bbb; }
    .footer_contents { height: 90px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header_contents">
      <div class="logo">
        <img class="mark" src="images/logo_mark.svg" alt="" width="40" height="40">
        <div class="name">SAMPLE SITE</div>
      </div>
    </div>
  </div>

  <div class="contents">
    <div class="visual">
      <div class="copy">
        <h1>Webの基礎を、<br>手を動かして学ぶ。</h1>
        <p>HTML / CSS からはじめる制作入門</p>
      </div>
    </div>

    <div class="text_wrapper">
      <div class="text">
        <h2>このサイトについて</h2>
        <p>枠（ボックス）を組み立て、色や画像・テキストを入れて、
           1つのWebサイトを完成させる流れを体験します。ブラウザ上の
           あらゆる要素が「四角い枠」で構成されていることを学びましょう。</p>
      </div>
      <div class="menu">
        <ul>
          <li>ホーム</li>
          <li>レッスン</li>
          <li>入門</li>
          <li>基礎</li>
          <li>応用</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer_contents">© SAMPLE SITE</div>
  </div>

</body>
</html>
