<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Hiragino Sans",Meiryo,sans-serif; background:#fff; padding:24px; }
  .row { display:flex; align-items:flex-end; gap:36px; }
  .unit > .cap { font-size:13px; font-weight:bold; color:#333; margin-bottom:8px; text-align:center; }
  .browser { border:1px solid #d9dee5; border-radius:8px 8px 6px 6px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .bbar { height:22px; background:#eef1f5; display:flex; align-items:center; gap:5px; padding:0 8px; border-bottom:1px solid #e2e6ec; }
  .bbar i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .bbar .r{background:#ff6159}.bbar .y{background:#ffbd2e}.bbar .g{background:#28c840}
  .screen { background:#f4f6f9; padding:14px 0; display:flex; justify-content:center; position:relative; }
  .gutter-label { position:absolute; top:50%; transform:translateY(-50%); font-size:10px; color:#e5484d; }
  .content { width:150px; background:linear-gradient(120deg,#2b6cb0,#30a46c); color:#fff; border-radius:5px;
             height:120px; display:flex; align-items:center; justify-content:center; text-align:center;
             font-size:11px; font-weight:bold; line-height:1.5; }
  .screen.narrow { width:220px; }
  .screen.wide   { width:440px; }
  .gut { position:absolute; top:14px; bottom:14px; width:0; border-left:1px dashed #f5a08f; }
  .arrow-w { position:absolute; height:1px; background:#f5a08f; top:50%; }
  .note { text-align:center; font-size:12px; color:#666; margin-top:14px; }
  .note b { color:#2b6cb0; }
</style></head>
<body>
  <div class="row">
    <div class="unit">
      <div class="cap">狭い画面</div>
      <div class="browser">
        <div class="bbar"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="screen narrow">
          <div class="content">固定幅<br>980px</div>
        </div>
      </div>
    </div>

    <div class="unit">
      <div class="cap">広い画面</div>
      <div class="browser">
        <div class="bbar"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="screen wide">
          <span class="gutter-label" style="left:34px">余白</span>
          <div class="content">固定幅<br>980px</div>
          <span class="gutter-label" style="right:34px">余白</span>
        </div>
      </div>
    </div>
  </div>
</body></html>
