<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Hiragino Sans",Meiryo,sans-serif; background:#fff; padding:24px; }
  .flow { display:flex; align-items:center; gap:14px; }
  .step { width:340px; }
  .arrow { font-size:34px; color:#cbd5e1; }
  .panel { border:1px solid #e5e7eb; border-radius:8px; padding:12px; background:#fafafa; height:260px; }

  /* ① 完成イメージ＋各要素の領域オーバーレイ */
  .panel.img { display:flex; align-items:center; justify-content:center; padding:10px; }
  .imgwrap { position:relative; width:318px; height:240px; }
  .siteimg { width:100%; height:100%; display:block; border:1px solid #e5e7eb; border-radius:4px; }
  .ov { position:absolute; border:2px solid; box-sizing:border-box; border-radius:2px; }
  .ov > b { position:absolute; top:0; left:0; font:bold 11px/1.4 "Hiragino Sans",Meiryo,sans-serif; color:#fff; padding:0 4px; white-space:nowrap; }
  .ov-h { border-color:#e5484d; } .ov-h > b { background:#e5484d; }
  .ov-v { border-color:#2b6cb0; } .ov-v > b { background:#2b6cb0; }
  .ov-t { border-color:#30a46c; } .ov-t > b { background:#30a46c; }
  .ov-m { border-color:#30a46c; } .ov-m > b { background:#30a46c; }
  .ov-f { border-color:#8e4ec6; } .ov-f > b { background:#8e4ec6; }

  /* ② 枠に分解 */
  .frame .bx { position:relative; border-width:2px; border-style:solid; border-radius:3px; margin-bottom:7px; }
  .frame .lb { position:absolute; top:1px; left:5px; font-size:11px; color:#666; background:#fafafa; padding:0 3px; }
  .frame .h { height:34px; border-color:#e5484d; }
  .frame .v { height:96px; border-color:#2b6cb0; }
  .frame .row { height:52px; display:flex; gap:7px; margin-bottom:7px; }
  .frame .row .t { flex:1; border:2px solid #30a46c; position:relative; border-radius:3px; }
  .frame .row .m { width:70px; border:2px solid #30a46c; position:relative; border-radius:3px; }
  .frame .f { height:28px; border-color:#8e4ec6; }

  /* ③ HTML */
  .code { background:#0f1b2d; color:#e6edf3; border-radius:6px; padding:12px; font:11px/1.6 "SFMono-Regular",Consolas,monospace; height:260px; overflow:hidden; }
  .code .tag{color:#7ee787}.code .at{color:#79c0ff}.code .st{color:#a5d6ff}.code .pu{color:#8b98a5}
</style></head>
<body>
  <div class="flow">
    <div class="step">
      <div class="panel img">
        <div class="imgwrap">
          <picture>
            <source srcset="../stage2_simple.webp" type="image/webp">
            <img class="siteimg" src="../stage2_simple.png" alt="SAMPLE SITE の完成イメージ。各要素の領域を色枠で示している">
          </picture>
          <span class="ov ov-h" style="top:0;left:0;width:100%;height:9.6%"><b>header</b></span>
          <span class="ov ov-v" style="top:13.4%;left:7.6%;width:84.6%;height:43.9%"><b>visual</b></span>
          <span class="ov ov-t" style="top:59.6%;left:14.8%;width:44.7%;height:15.3%"><b>text</b></span>
          <span class="ov ov-m" style="top:59.6%;left:67.2%;width:17.5%;height:25.6%"><b>menu</b></span>
          <span class="ov ov-f" style="top:89.7%;left:0;width:100%;height:10.3%"><b>footer</b></span>
        </div>
      </div>
    </div>

    <div class="arrow">▶</div>

    <div class="step">
      <div class="panel frame">
        <div class="bx h"><span class="lb">header</span></div>
        <div class="bx v"><span class="lb">visual</span></div>
        <div class="row">
          <div class="t"><span class="lb">text</span></div>
          <div class="m"><span class="lb">menu</span></div>
        </div>
        <div class="bx f"><span class="lb">footer</span></div>
      </div>
    </div>

    <div class="arrow">▶</div>

    <div class="step">
      <div class="code"><span class="pu">&lt;</span><span class="tag">div</span> <span class="at">class</span><span class="pu">=</span><span class="st">"header"</span><span class="pu">&gt;&lt;/</span><span class="tag">div</span><span class="pu">&gt;</span><br><span class="pu">&lt;</span><span class="tag">div</span> <span class="at">class</span><span class="pu">=</span><span class="st">"visual"</span><span class="pu">&gt;&lt;/</span><span class="tag">div</span><span class="pu">&gt;</span><br><span class="pu">&lt;</span><span class="tag">div</span> <span class="at">class</span><span class="pu">=</span><span class="st">"text"</span><span class="pu">&gt;&lt;/</span><span class="tag">div</span><span class="pu">&gt;</span><br><span class="pu">&lt;</span><span class="tag">div</span> <span class="at">class</span><span class="pu">=</span><span class="st">"menu"</span><span class="pu">&gt;&lt;/</span><span class="tag">div</span><span class="pu">&gt;</span><br><span class="pu">&lt;</span><span class="tag">div</span> <span class="at">class</span><span class="pu">=</span><span class="st">"footer"</span><span class="pu">&gt;&lt;/</span><span class="tag">div</span><span class="pu">&gt;</span></div>
    </div>
  </div>
</body></html>
